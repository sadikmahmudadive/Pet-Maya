; Pet Maya LoRa gateway — ESP32-WROOM-32 + Ai-Thinker Ra-02 (SX1278, 433 MHz) on Wi-Fi.
; Mains powered, always listening. Relays any Pet Maya tracker's encrypted frames to the
; cloud and delivers its downlinks. Holds no tracker keys.

[platformio]
default_envs = gateway

[gateway_base]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
board_build.partitions = partitions.csv
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_extra_dirs = ../shared/lib
lib_deps =
    jgromes/RadioLib@^7.1.0
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DFW_VERSION=\"1.0.0\"
    -DLORA_INGEST_URL=\"https://us-central1-pet-maya.cloudfunctions.net/lora_ingest\"
    -DCORE_DEBUG_LEVEL=1
    -Wall -Wextra -Wno-unused-parameter

[env:gateway]
extends = gateway_base
build_flags = ${gateway_base.build_flags} -Os

[env:gateway-debug]
extends = gateway_base
build_flags = ${gateway_base.build_flags} -DDEBUG_LOG=1 -DCORE_DEBUG_LEVEL=3

[env:gateway-sx1279]
extends = gateway_base
build_flags = ${gateway_base.build_flags} -Os -DRADIO_SX1279=1
