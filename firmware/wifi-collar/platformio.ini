; Pet Maya ProTrack — GPS smart collar firmware
; Core: ESP32-WROOM-32 DevKit (board "esp32dev"), Arduino framework.

[platformio]
default_envs = esp32dev

[esp32_base]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
board_build.partitions = partitions.csv   ; dual OTA slots
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_extra_dirs = ../shared/lib
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DFW_VERSION=\"1.0.0\"
    -DINGEST_URL=\"https://us-central1-pet-maya.cloudfunctions.net/device_ingest\"
    -DCORE_DEBUG_LEVEL=1
    -Wall -Wextra -Wno-unused-parameter

; Production build (default): quiet serial, optimised for size.
[env:esp32dev]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -Os

; Verbose serial logging for bench work.
[env:esp32dev-debug]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DDEBUG_LOG=1
    -DCORE_DEBUG_LEVEL=4

; Host-side unit tests for the pure logic in lib/petlogic:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_extra_dirs = ../shared/lib
lib_ignore = pmhw
