; Pet Maya LoRa Finder — ESP32-WROOM-32 + Ai-Thinker Ra-02 (SX1278, 433 MHz) + Bluetooth LE.
; Fully offline: hears your trackers directly over LoRa, decrypts them locally and streams
; them to the Pet Maya app over BLE. No gateway, SIM or internet needed.

[platformio]
default_envs = finder

[finder_base]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
board_build.partitions = partitions.csv
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_extra_dirs = ../shared/lib
lib_deps =
    jgromes/RadioLib@^7.1.0
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DFW_VERSION=\"1.0.0\"
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -Wall -Wextra -Wno-unused-parameter

[env:finder]
extends = finder_base
build_flags = ${finder_base.build_flags} -Os

[env:finder-debug]
extends = finder_base
build_flags = ${finder_base.build_flags} -DDEBUG_LOG=1 -DCORE_DEBUG_LEVEL=3

[env:finder-sx1279]
extends = finder_base
build_flags = ${finder_base.build_flags} -Os -DRADIO_SX1279=1
