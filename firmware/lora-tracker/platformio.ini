; Pet Maya LoRa tracker — ESP32-WROOM-32 + NEO-6M GPS + Ai-Thinker Ra-02 (SX1278, 433 MHz).
; No SIM, no subscription: uplinks go to any Pet Maya LoRa gateway (see ../lora-gateway).

[platformio]
default_envs = tracker

[tracker_base]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_extra_dirs = ../shared/lib
lib_deps =
    jgromes/RadioLib@^7.1.0
    mikalhart/TinyGPSPlus@^1.1.0
build_flags =
    -DFW_MAJOR=1
    -DFW_MINOR=0
    -DCORE_DEBUG_LEVEL=1
    -Wall -Wextra -Wno-unused-parameter

[env:tracker]
extends = tracker_base
build_flags = ${tracker_base.build_flags} -Os

[env:tracker-debug]
extends = tracker_base
build_flags = ${tracker_base.build_flags} -DDEBUG_LOG=1 -DCORE_DEBUG_LEVEL=3

; Ra-01/Ra-02 boards built on an SX1279 instead of an SX1278.
[env:tracker-sx1279]
extends = tracker_base
build_flags = ${tracker_base.build_flags} -Os -DRADIO_SX1279=1

; Host tests for the wire format: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_extra_dirs = ../shared/lib
lib_ignore = pmhw
